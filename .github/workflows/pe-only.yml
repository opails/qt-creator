name: Build ProjectExplorer only

# 手动触发 + push 到该分支自动跑。手动更稳,不被无关 push 牵着跑。
on:
  workflow_dispatch: {}
  push:
    branches: [ build-pe ]

env:
  QT_VERSION: 6.10.3

jobs:
  build-pe:
    runs-on: windows-2022
    steps:
      # 1. 拉你 fork 的源码(默认只拉一层,不带 submodule)
      - uses: actions/checkout@v4

      # 2. 拉 submodule(qlitehtml 等);19.0 也用了,跳过会 configure 失败
      - name: Checkout submodules
        shell: bash
        run: git submodule update --init --recursive

      # 3. 装 Qt —— aqtinstall,版本对齐 19.0 的 6.10.3,模块对齐官方 build_cmake.yml
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtshadertools qtquick3d qtquicktimeline qtserialport qt5compat'
          cache: true

      # 4. configure —— 只生成构建文件,不编。关掉测试,关掉文档,加快。
      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_TESTS=OFF \
            -DBUILD_DOCS=OFF

      # 5. 只编 ProjectExplorer 这一个 target(它的依赖 Core/TextEditor/Utils
      #    等会被一起编出来,但其他无关插件不编,省大量时间)
      - name: Build ProjectExplorer
        shell: bash
        run: cmake --build build --target ProjectExplorer

      # 6. 把产出的 dll 上传,跑完可在 Actions 页下载,证明编译通过
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: ProjectExplorer-dll
          path: build/**/ProjectExplorer*.dll
          if-no-files-found: error
